[project]
name = "ai-stylist"
version = "0.1.0"
description = "Personal AI Stylist — wardrobe cataloguing and outfit suggestions"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "redis>=5.0",
  "arq>=0.26",
  "boto3>=1.34",
  # [crypto] pulls `cryptography`, needed for RS256. Our own session tokens are
  # HS256 and do not need it; FCM's HTTP v1 API does — a service-account JWT is
  # signed with the account's RSA private key. Chosen over `firebase-admin`,
  # which brings ~20 transitive dependencies and a credential-discovery layer
  # that reads ambient environment, for the same reason google_calendar.py is
  # written against the HTTP API directly.
  "pyjwt[crypto]>=2.8",
  "bcrypt>=4.1",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "pillow>=10.3",
  "pgvector>=0.3",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "greenlet>=3.0",
  "types-PyYAML>=6.0",
  "piexif>=1.1.3",
]

# Matting runs only in services/stylist_ml, so rembg + onnxruntime are an
# extra rather than a base dependency: the api and worker images do not need
# ~200MB of inference runtime just to start.
ml = [
  "rembg[cpu]>=2.0.60",
]

# Tracing is opt-in. The SDK plus an OTLP exporter is ~8MB of dependencies for
# a feature that does nothing without a collector to export to, so it is an
# extra rather than a base dependency — and stylist_obs degrades to a no-op
# when it is absent, so nothing breaks if it is not installed.
observability = [
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Packages live under packages/ (shared libraries) and services/ (apps).
# `stylist_domain` must never import from stylist_db / stylist_api /
# stylist_clients — tests/test_domain_purity.py enforces that boundary, which
# is what keeps the deterministic scoring path independent of the AI path.
[tool.setuptools.packages.find]
where = ["packages", "services"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["packages", "services"]
filterwarnings = ["error::DeprecationWarning:stylist_.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages", "services", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "B008",    # FastAPI's Depends() in defaults is the documented idiom
  "RUF012",  # ClassVar annotations on arq's WorkerSettings add noise
]

[tool.ruff.lint.isort]
known-first-party = ["stylist_domain", "stylist_db", "stylist_clients", "stylist_api"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "packages:services"
explicit_package_bases = true
# Third-party packages without shipped stubs.
[[tool.mypy.overrides]]
module = ["arq.*", "boto3.*", "botocore.*", "rembg.*", "onnxruntime.*", "scipy.*"]
ignore_missing_imports = true


# opentelemetry is an OPTIONAL extra (see [project.optional-dependencies]).
# stylist_obs imports it inside a try/except and degrades to a no-op, so a
# checkout without the extra installed must still typecheck.
[[tool.mypy.overrides]]
module = ["opentelemetry.*"]
ignore_missing_imports = true
