# Local development stack (Step 1.2).
#
# HOST PORTS ARE DELIBERATELY NON-STANDARD. A developer machine very often
# already has Postgres on 5432 and something on 8000; colliding there produces
# the worst possible failure mode, where your app connects successfully to the
# WRONG database. Container-internal ports stay standard.
#
# TWO REDIS CONTAINERS, NOT TWO LOGICAL DATABASES. Production uses db0/db1 on
# one managed instance, which is fine when `noeviction` is configured on the
# queue db. Locally we use separate containers so an eviction policy cannot
# reach the queue even by mistake — a cache LRU eviction silently deleting
# queued jobs is invisible until work quietly stops happening (§C2).

name: ai-stylist

services:
  postgres:
    # pgvector image even though Phase 1 does not use vectors: Phase 3 adds the
    # embedding column, and having the extension available from the start means
    # that migration is not also an infrastructure change.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: stylist_owner
      POSTGRES_PASSWORD: stylist_owner_local_only
      POSTGRES_DB: stylist
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stylist_owner -d stylist"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis-queue:
    image: redis:7-alpine
    # noeviction: nothing in here is disposable. If this fills up we want
    # writes to fail loudly, not for jobs to be silently dropped.
    command: >
      redis-server
      --appendonly yes
      --maxmemory-policy noeviction
    ports:
      - "63790:6379"
    volumes:
      - redis_queue_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis-cache:
    image: redis:7-alpine
    # allkeys-lru: everything here (rationales, boards, weather context) is
    # recomputable, so evicting under pressure is correct behaviour.
    # PROVISIONAL: retune in P9. 512mb is a guess; the capacity model says
    # ~2GB of rationales + boards + context at 50k MAU, but this is a laptop.
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "63791:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 30

  # One-shot: create the bucket and turn versioning ON.
  # Versioning is not just durability — erasure step 4 must delete ALL VERSIONS,
  # because a plain delete against a versioned bucket leaves a recoverable
  # version, which is not erasure (§C5). Getting the flag on from day one means
  # the deletion code is written against the real behaviour.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/stylist-local &&
      mc version enable local/stylist-local &&
      mc anonymous set none local/stylist-local &&
      echo 'bucket ready, versioning enabled, no public access'
      "
    restart: "no"

  migrate:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Migrations run as the OWNER. The app never does.
      MIGRATION_DATABASE_URL: postgresql://stylist_owner:stylist_owner_local_only@postgres:5432/stylist
    command: alembic -c packages/stylist_db/alembic.ini upgrade head
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis-queue:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      ENVIRONMENT: local
      # NOTE the app role, not the owner. RLS is bypassed by superusers, so
      # connecting as the owner would silently disable every tenant policy.
      DATABASE_URL: postgresql+asyncpg://stylist_app:stylist_app_local_only@postgres:5432/stylist
      REDIS_QUEUE_URL: redis://redis-queue:6379/0
      REDIS_CACHE_URL: redis://redis-cache:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      # What the BROWSER must use. Presigned URLs signed with the internal
      # hostname are unresolvable outside the compose network.
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_BUCKET: stylist-local
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
    ports:
      - "8080:8000"
    command: uvicorn stylist_api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../../packages:/app/packages
      - ../../services:/app/services
      - ../../config:/app/config
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis-queue:
        condition: service_healthy
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+asyncpg://stylist_app:stylist_app_local_only@postgres:5432/stylist
      REDIS_QUEUE_URL: redis://redis-queue:6379/0
      REDIS_CACHE_URL: redis://redis-cache:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: stylist-local
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      ML_BASE_URL: http://ml:8000
    command: arq stylist_worker.main.WorkerSettings
    volumes:
      - ../../packages:/app/packages
      - ../../services:/app/services
      - ../../config:/app/config
    # Without a healthcheck, `compose up --wait` only waits for the container
    # to be RUNNING — so a worker that starts and immediately dies reports as
    # started and the failure is invisible. This reads the health record arq
    # writes to Redis every health_check_interval (30s), so a hung or dead
    # worker actually fails the check.
    healthcheck:
      # arq writes this key every health_check_interval (30s) with TTL
      # interval+1, so a dead or hung worker fails within ~31s. Uses the
      # SYNCHRONOUS redis client deliberately: a `python -c` one-liner cannot
      # contain an `async def` block, and YAML folding turns any multi-line
      # form into a single line — which is exactly how this check was broken
      # the first time.
      test:
        - CMD-SHELL
        - python -c "import sys,redis; sys.exit(0 if redis.Redis.from_url('redis://redis-queue:6379/0').get('arq:health-check') else 1)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  ml:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
      # Only this image needs the ~200MB inference runtime; api and worker
      # stay slim.
      args:
        INSTALL_ML: "true"
    environment:
      ENVIRONMENT: local
      # rembg resolves its weight cache from here. Populated on the HOST by
      # `python scripts/download_models.py`, then mounted in read-only.
      U2NET_HOME: /models/u2net
    ports:
      - "8081:8000"
    command: uvicorn stylist_ml.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../../packages:/app/packages
      - ../../services:/app/services
      # Model weights come from a MOUNT, never baked into the image. A 176MB
      # checkpoint in a layer makes every deploy slow and every model swap a
      # rebuild (View 2). Read-only: this service must never mutate weights.
      - ../../models:/models:ro
    healthcheck:
      # /readyz, not /healthz: readiness is true only once the ONNX session is
      # built (~20s), and gating `compose up --wait` on liveness would declare
      # the stack ready while the first ingest still had a 20s model load ahead
      # of it. start_period covers the load without counting as failures.
      test: ["CMD-SHELL", "python -c \"import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/readyz').status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  postgres_data:
  redis_queue_data:
  minio_data:
