# LiteLLM gateway — the ONLY egress path to model providers (View 3).
#
# Every model call routes through here from the first line of code, including
# self-hosted embeddings priced at zero. Two reasons, and the second is the one
# that matters:
#
#   1. Uniform observability. One place that knows every call's model, tokens,
#      cost, latency and cache status, instead of per-call-site logging that
#      drifts.
#   2. THE DEGRADE LADDER. Models priced at zero are exempt from budget checks,
#      so a tenant who exhausts their spend still gets cataloguing and
#      deterministic boards. Budget exhaustion becomes a feature downgrade
#      rather than an outage (§B3). That only works if the zero-cost models are
#      behind the same gateway that enforces the budget.
#
# Retrofitting this later means touching every call site, which is why it is
# wired before there is a paid provider to call.

model_list:
  # ---- the paid tier: garment tagging -------------------------------------
  #
  # api_key comes from the environment and may be UNSET. That is deliberate:
  # with no key, calls fail and the ingest pipeline degrades to
  # DEGRADED_TAGGED — the behaviour we want tested before a key exists.
  #
  # PROVIDER IS GEMINI, AND THE ROW KEEPS THE NAME `vlm-tagger`. Swapping the
  # model inside this row rather than adding a `vlm-tagger-gemini` row is what
  # keeps the fallback working: `fallbacks` below is keyed on model_name, so a
  # new name would silently have no backup provider.
  #
  # `gemini/` IS GOOGLE AI STUDIO, NOT VERTEX. AI Studio's free tier permits
  # Google to train on submitted content, and what we submit is photographs of
  # users' clothes. That is fine for dev and eval against the golden set; it is
  # NOT the production posture. Production moves this to `vertex_ai/`, whose
  # enterprise terms are what the Phase 0.3 DPA is about — the prefix is the
  # only line that changes.
  - model_name: vlm-tagger
    litellm_params:
      # 2.5-flash is closed to new API keys; Google's own 404 points here.
      model: gemini/gemini-3.6-flash
      api_key: os.environ/GEMINI_API_KEY
      # 12MB images, batched 6 to a grid; the grid is what is actually sent.
      #
      # 4096, NOT 2048. Gemini 3.x thinks by default and those reasoning tokens
      # are charged against max_tokens before a single character of JSON is
      # emitted — a measured 758 reasoning tokens against 4 of text. At 2048 a
      # six-cell grid truncates mid-object and the whole batch is discarded as
      # unparseable, which presents as the model failing rather than the
      # ceiling being too low.
      max_tokens: 4096
      # Tagging is extraction against a fixed vocabulary, not a problem to
      # reason about. Low keeps the thinking budget small so the ceiling above
      # is spent on the answer.
      reasoning_effort: low
      temperature: 0.0 # tagging is extraction, not generation
    model_info:
      mode: chat

  # Fallback target. A second PROVIDER, not a second model from the same one:
  # provider outages correlate across their own models.
  - model_name: vlm-tagger-backup
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
      max_tokens: 2048
      temperature: 0.0
    model_info:
      mode: chat

  # ---- open-weight taggers -------------------------------------------------
  #
  # ADDED so tagging can run while the Gemini key has no prepaid credit. The
  # `vlm-tagger` row above is LEFT EXACTLY AS IT WAS — switching is a
  # `VLM_MODEL` change, not an edit here, so going back to Gemini is one env
  # var and no diff.
  #
  # THE HARD REQUIREMENT IS STRUCTURED OUTPUT. The tag stage sends
  # `response_format: {type: json_schema, strict: true}` (see
  # stylist_domain.vlm_schema), and a model that ignores it returns prose the
  # stage discards as unparseable — which looks like the model being bad at
  # clothes rather than bad at JSON. Both rows below were chosen for schema
  # support, not for benchmark scores.

  # Runs on YOUR machine. No key, no quota, no bill, nothing leaves the laptop
  # — which also means garment photos stop being sent to a third party while
  # testing. `host.docker.internal` is how this container reaches Ollama on the
  # Mac; it resolves here (checked) because Docker Desktop provides it.
  #
  # qwen2.5vl:7b over llava: it is markedly better at reading small text and
  # fine pattern detail, which is most of what tagging asks for, and it honours
  # a JSON schema where llava tends to narrate.
  - model_name: vlm-tagger-ollama
    litellm_params:
      model: ollama_chat/qwen2.5vl:7b
      api_base: http://host.docker.internal:11434
      max_tokens: 4096
      temperature: 0.0
      # Local inference is slow next to a hosted API; a 6-cell grid on a
      # laptop GPU is tens of seconds, not hundreds of milliseconds. The tag
      # stage is async-plane work nobody waits on, so this is affordable.
      timeout: 600
      input_cost_per_token: 0
      output_cost_per_token: 0
    model_info:
      mode: chat

  # Hosted open weights. Faster than local by a wide margin and free at low
  # volume, but it IS a third party, so garment photos leave the machine — the
  # same consideration as Gemini, just a different company.
  #
  # The `:free` suffix is OpenRouter's free tier. Those model slugs rotate, so
  # if this 404s check https://openrouter.ai/models?q=free for a current one
  # rather than assuming the row is broken.
  - model_name: vlm-tagger-openrouter
    litellm_params:
      # VERIFIED AGAINST openrouter.ai/api/v1/models ON 2026-09-21. The slug
      # this row originally carried (qwen2.5-vl-72b) had already been rotated
      # out of the free tier — checking beat discovering it as a 404 mid-test.
      #
      # Chosen from the free models that declare BOTH image input and
      # `structured_outputs`. That second filter is the binding one: the tag
      # stage sends strict json_schema, and a model without it returns prose
      # the stage throws away.
      #
      # If this 404s, re-run the same check — the free tier rotates, and
      # google/gemma-4-31b-it:free was the equivalent alternative that day.
      # PROBED LIVE 2026-09-21 against a real garment photo and this exact
      # json_schema. Of the free vision models, qwen3.8-27b and both gemma-4
      # variants returned 429 from the SHARED UPSTREAM POOL (not an account
      # limit — nothing you can fix with a key), and `openrouter/free`
      # auto-routed to a content-safety model that cannot do extraction.
      # This one answered in 33s with schema-valid JSON.
      #
      # Free-tier availability moves daily. When this 429s, re-run the same
      # probe rather than assuming the integration broke.
      # PROBED LIVE 2026-09-21 against a real garment photo and this exact
      # json_schema. It returned schema-valid JSON in 36s and read a blue
      # khadi kurta correctly as subcategory=kurta, material=cotton.
      #
      # WHAT THE OTHER FREE MODELS DID, so this is not re-litigated:
      #   qwen3.8-27b, gemma-4-31b, gemma-4-26b  429 from the SHARED upstream
      #                                          pool — not an account limit
      #   openrouter/free                        auto-routed to a
      #                                          content-safety model
      #   ling-3.0-flash-vl                      400 on this request shape
      #   nex-n2.5-pro                           spent 4174 of 4096 tokens
      #                                          REASONING and emitted no JSON
      #
      # That last one is the trap the `vlm-tagger` row documents for Gemini
      # 3.x, and it is not provider-specific: a reasoning model charges its
      # thinking against max_tokens before the answer, and its upstream cap
      # was 4096 no matter what was requested.
      #
      # Free-tier availability moves daily. When this 429s, re-probe rather
      # than assuming the integration broke.
      model: openrouter/dots-studio/dots-3-note-preview:free
      api_key: os.environ/OPENROUTER_API_KEY
      # 16384, AND reasoning_effort low. This model THINKS, and measured here
      # it spent 4174 reasoning tokens of a 4096 budget and emitted zero
      # characters of JSON — finish_reason `length`, content empty, which the
      # tag stage discards as unparseable and reports as the model failing.
      #
      # This is the same trap the `vlm-tagger` row above documents for Gemini
      # 3.x. It is not a Gemini quirk; it is what any reasoning model does when
      # the ceiling is set for the ANSWER and not for the thinking that
      # precedes it. Reasoning length also varies run to run, so a budget that
      # works once is not a budget that works.
      # 8192, not 4096. Measured on ONE cell: 2961 reasoning + 255 content =
      # 3216, already 79% of a 4096 ceiling. The tag stage batches SIX
      # garments to a grid, so the content grows ~6x while the reasoning does
      # not shrink — at 4096 a full grid truncates mid-object and the whole
      # batch is discarded as unparseable.
      # 8192. The model's own ceiling is 460800, so this is ours, not theirs —
      # measured usage is 1475-4084 completion tokens per garment and a
      # six-cell grid grows the answer while the reasoning does not shrink.
      max_tokens: 8192
      # THE REAL LEVER. Measured 2178-2961 REASONING tokens to tag one
      # garment — for extraction against a fixed vocabulary, where the model
      # is choosing from enums, not solving anything. That thinking is most of
      # the 29s latency and most of the truncation risk, and one garment in
      # six failed to parse because of it.
      # NO REASONING CAP, and that is a finding rather than an omission.
      #
      # This model spends ~2400 tokens THINKING to pick enum values, which is
      # most of the ~30s latency and the reason roughly one garment in six
      # truncates. Calling OpenRouter directly, `reasoning: {effort: low}`
      # cuts that to 1420 tokens and 23s — measured, a 42% reduction.
      #
      # It cannot be reached through this gateway. Three routes were tried and
      # all were stripped before the provider saw them:
      #     reasoning_effort: low       (config)        -> 2139 tokens, no change
      #     reasoning: {effort: low}    (config)        -> 2543 tokens, no change
      #     reasoning / extra_body      (request body)  -> 3764 tokens, no change
      #
      # A no-op setting left in here would read as a tuning decision that had
      # been made. It has not been, so there is nothing here instead. Revisit
      # if LiteLLM adds OpenRouter reasoning passthrough; until then the cost
      # is latency on async-plane work nobody waits for, which is affordable.
      temperature: 0.0
      # Generous because tagging is async-plane work nobody waits on, and a
      # timeout shorter than the work is a self-inflicted failure.
      timeout: 600
    model_info:
      mode: chat

  # Groq. NO PAYMENT METHOD REQUIRED — the free tier needs only a signup,
  # where OpenRouter asks for a spending cap on key creation even though it
  # never charges a $0 balance. Also by far the fastest of the three: Groq
  # runs open weights on their own inference hardware, so a tag call is
  # seconds rather than the minutes local inference took.
  #
  # Rate-limited per minute and per day rather than by cost. That suits the
  # tag stage, which is async-plane work behind a queue — a 429 is backpressure
  # the state machine already knows how to wait on (see UNAVAILABLE_BUDGET).
  #
  # Llama 4 Scout is the vision model on the free tier; if this name 404s,
  # check console.groq.com/docs/models for the current one.
  - model_name: vlm-tagger-groq
    litellm_params:
      model: groq/meta-llama/llama-4-scout-17b-16e-instruct
      api_key: os.environ/GROQ_API_KEY
      max_tokens: 4096
      temperature: 0.0
      timeout: 120
    model_info:
      mode: chat

  # ---- local development: a deterministic stand-in ------------------------
  #
  # mock_response makes the gateway answer without any provider, so the whole
  # path — virtual keys, budgets, spend logging, fallbacks, the tag stage's
  # schema validation — is exercisable with no credentials and no cost. It is
  # NOT a pretend model: the content is obviously synthetic, and the tag stage
  # validates it against taxonomy.yaml exactly as it would a real response.
  - model_name: vlm-tagger-mock
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: "sk-mock-not-a-real-key"
      # A SCHEMA-VALID response, not an empty one. An empty payload means
      # the tag stage's parse/validate/write path never runs locally, so
      # the first time it executes is against a paid provider. `material`
      # is deliberately below its 0.60 review threshold (55 -> 0.55) so the
      # needs_review gate is exercised too.
      mock_response: '{"items": [{"cell": "A1", "subcategory": "kurta", "material": "cotton", "formality": 3, "dress_code": "festive_ethnic", "warmth": 2, "fit": "relaxed", "confidence": {"subcategory": 82, "material": 55, "formality": 78, "dress_code": 71, "warmth": 80, "fit": 62}}, {"cell": "A2", "subcategory": "jeans", "material": "denim", "formality": 2, "dress_code": "casual", "warmth": 3, "fit": "slim", "confidence": {"subcategory": 91, "material": 88, "formality": 84, "dress_code": 86, "warmth": 75, "fit": 69}}]}'
      input_cost_per_token: 0
      output_cost_per_token: 0
    model_info:
      mode: chat

  # ---- the reranker: Phase 7, and a DIFFERENT policy to tagging -----------
  #
  # Tagging is async-plane work nobody waits for: 180s, two retries, batched.
  # The reranker sits on a user-facing GET with a 1500ms SLO, so it gets the
  # opposite of all three. The timeout (1200ms) and `num_retries: 0` are sent
  # PER REQUEST by the client rather than set here, because `num_retries: 2` in
  # litellm_settings below is global — a retry inside a 1200ms budget cannot
  # make the SLO, it can only turn one slow response into a breach.
  #
  # Text in, text out. No images ever reach this row: eight outfits of pixels
  # cannot be done in 1200ms, and the tags already ARE the extraction.
  - model_name: outfit-reranker
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/GEMINI_API_KEY
      # ~1.2k in / 300 out per §7.1, plus headroom for Gemini's reasoning
      # tokens, which are charged against max_tokens before any JSON appears.
      max_tokens: 2048
      reasoning_effort: low
      temperature: 0.0
    model_info:
      mode: chat

  # THERE IS DELIBERATELY NO `outfit-reranker-mock`, and the reason is worth
  # recording because tagging DOES have one.
  #
  # A mock answers with a fixed string. The reranker's response must echo the
  # GARMENT IDS it was sent — uuids generated per request — so a static mock
  # response can only ever contain ids that are not in the input set. Every
  # local request would then fail §C3 assertion 2, and `validator.reject` would
  # sit at 100% with `rule="unknown_id"`. That metric is this phase's earliest
  # quality signal and has a <2% exit criterion; pinning it at 100% locally
  # would bury the real thing it exists to detect under noise we manufactured.
  #
  # So the local posture is Phase 4's, not Phase 4's mock: with no key the row
  # below fails, the client raises `LiteLLMUnavailable`, and the suggestion
  # degrades to deterministic order with a template rationale — the DEGRADE
  # ladder as the default, exercised on every request rather than in a drill,
  # and with no counterfeit rejections. The ACCEPT path is covered by
  # tests/test_rerank.py against a fake gateway, where ids can be echoed.

  # ---- self-hosted, priced at zero ---------------------------------------
  #
  # Routed through the gateway for uniform observability, and priced at zero so
  # LiteLLM skips budget checks. This row IS the degrade path: when a tenant's
  # budget is gone, embeddings and matting keep working.
  # ---- intent classification (Phase 12) ----------------------------------
  #
  # Reached ONLY when the lexicon in stylist_domain/intent.py finds nothing.
  # "Diwali", "client meeting" and the other 130-odd phrases never get here,
  # so this row carries the long tail — "visiting Patna as a tourist",
  # "meeting my girlfriend's parents" — and nothing on the hot path.
  #
  # A TEXT model, not the vision row. The tagger's OpenRouter slug is chosen
  # for image input plus structured outputs; this needs neither the image
  # capability nor its 30-second latency, and reusing it would put a vision
  # model's cold start in front of a chat reply.
  #
  # Free tier, because Gemini's credits are depleted and an intent classifier
  # that only works when billing does is an intent classifier that will be
  # off exactly when someone is trying the product for the first time. When
  # this 429s or 404s the caller degrades to the clarifying question, which
  # is the behaviour that shipped before this row existed.
  - model_name: intent-classifier
    litellm_params:
      # RE-PROBED LIVE 2026-09-23. THE ROW BELOW HAS DEGRADED; READ THIS FIRST.
      #
      # All eight free OpenRouter models declaring text + structured outputs
      # are REASONING models — there is no instruct-only free option left, so
      # the trap the tagger rows document is now the whole tier. Six queries
      # each, this exact schema:
      #
      #   nemotron-3-super-120b   4/6 usable, 0/4 correct, 5.8s   <- this row
      #   nex-n2.5-mini           2/3 then 429 on every retry
      #   nex-n2.5-pro            2/3 usable, 11-65s
      #   gemma-4-26b/31b, qwen3.8-27b   429 on every call
      #   dots-3-note, lfm-2.5-2.6b      empty content
      #   intent-classifier-local 6/6 usable, 2/4 correct, 1.4s   <- the local
      #                           fallback, measurably better on every axis
      #
      # Its characteristic failure is NOT an error, which is what makes it
      # expensive: it returns HTTP 200 carrying
      #
      #     {"{ "occasion": "festival_day" \n \n \n ... (to max_tokens)
      #
      # The classification is RIGHT and the wrapper is broken. A 200 does not
      # trigger the `fallbacks` entry below — that only catches 402/429/5xx —
      # so the local model never sees these. `intent_llm.parse_answer` is what
      # recovers them; see its salvage section.
      #
      # NOT REPLACED, because nothing free is better: the two rows that beat
      # it on one probe failed the next. The real options are a paid model or
      # running the local row first, and both are decisions above this file.
      #
      # ---- the 2026-09-21 probe that chose this row, now stale ----
      # PROBED LIVE 2026-09-21 against this exact json_schema and a real
      # long-tail query ("my cousin's daughter has her naming ceremony").
      # Chosen from the free models declaring text input AND structured
      # outputs; of the eight that qualified, only this one answered:
      #
      #   nemotron-3-super-120b          4.0s, schema-valid JSON  <- this row
      #   nex-n2.5-mini                  3.7s, EMPTY content
      #   dots-3-note-preview            7.2s, EMPTY content  (the tagger's
      #                                  row — it does images, not this)
      #   lfm-2.5-2.6b                   9.5s, EMPTY content
      #   qwen3.8-27b, gemma-4-26b,      429 from the SHARED upstream pool,
      #   gemma-4-31b                    exactly as the tagger row records
      #
      # The row this replaced was meta-llama/llama-3.3-70b-instruct:free,
      # which I wrote from memory without probing. It 404s: OpenRouter's own
      # message is "This model is unavailable for free. The paid version is
      # available now". That is the trap the tagger rows document, walked
      # straight into — check the live list, do not recall it.
      model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
      api_key: os.environ/OPENROUTER_API_KEY
      # Small answer, no reasoning wanted. The traps documented on the tagger
      # rows are about reasoning models spending the whole budget thinking;
      # this asks an instruct model for three fields, so 512 is generous.
      max_tokens: 512
      temperature: 0.0
    model_info:
      mode: chat

  # OPEN SOURCE, LOCAL, AND FREE. Added so the product can be exercised end
  # to end with no provider credit at all.
  #
  # Both hosted classifiers stopped answering on the same day: Gemini returned
  # RESOURCE_EXHAUSTED ("prepayment credits are depleted") and the free
  # OpenRouter slug returned 402, and malformed JSON when it did answer. The
  # LLM fallback degrades honestly in that case -- the chat asks the user
  # instead -- but "I'm not sure what the occasion is" for *cultural wear* is
  # not a product anyone can judge.
  #
  # Reuses the model already pulled for tagging rather than adding a download.
  # It is a vision model doing a text job, which is wasteful and entirely
  # adequate for a 30-token classification.
  #
  # NOT THE PRODUCTION ANSWER. It runs on the developer's machine, so latency
  # is whatever that machine can do and nothing is served from it when the
  # laptop is shut. `intent-classifier` stays pointed at a hosted model; this
  # is the fallback that makes a dead credit card a slow answer instead of no
  # answer.
  - model_name: intent-classifier-local
    litellm_params:
      # qwen2.5:3b, TEXT-ONLY and small on purpose. MEASURED, all three:
      #   qwen2.5vl:7b   timed out at 180s on every message (vision weights,
      #                  wrong tool for a 30-token classification)
      #   qwen2.5:7b     23-32s per call and intermittent failures -- too slow
      #                  to sit in front of a chat box
      #   qwen2.5:3b     1.4-7s, schema-valid every time  <- this
      #
      # Its weakness is accuracy, not speed: it answered *poetry reading* with
      # griha_pravesh at confidence 1.0. A 3B model cannot do a 28-way
      # classification well, and it does not know that it cannot. Good enough
      # to exercise the product; not good enough to ship. The first attempt reused
      # qwen2.5vl:7b -- already pulled for tagging, so no download -- and it
      # TIMED OUT at 180s on every message: a 7B vision model is the wrong
      # tool for a thirty-token classification. A 3B text model answers in
      # seconds on the same machine.
      model: ollama_chat/qwen2.5:3b
      api_base: http://host.docker.internal:11434
      max_tokens: 512
      temperature: 0.0
      # Generous: a 7B model on CPU is slow, and a timeout here costs the
      # user the clarification they were already getting.
      timeout: 120
      input_cost_per_token: 0
      output_cost_per_token: 0
    model_info:
      mode: chat

  - model_name: embed-fashion
    litellm_params:
      model: openai/marqo_fashionsiglip_vision
      api_base: http://ml:8000/v1
      api_key: "not-used-self-hosted"
      input_cost_per_token: 0
      output_cost_per_token: 0

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/LITELLM_DATABASE_URL
  # Hot-swappable model list: changing a model becomes an UPDATE rather than a
  # deploy, which is what makes rollback possible without shipping code (§D1).
  store_model_in_db: true

litellm_settings:
  drop_params: true
  # LANGFUSE (§D3). Traces every model call — prompt, response, tokens, cost,
  # latency — to a UI built for inspecting them, which is what you want the
  # first time a tag comes back wrong and the question is what the model was
  # actually shown.
  #
  # Enabled by the presence of keys, not by this line: with the callback set
  # and no LANGFUSE_PUBLIC_KEY, LiteLLM logs an exporter error on EVERY call,
  # which turns a missing integration into per-request noise that buries real
  # errors. The compose file passes the keys through; set them in .env and
  # uncomment the two lines below.
  #
  # success_callback: ["langfuse"]
  # failure_callback: ["langfuse"]
  # Two retries INSIDE the gateway, then fall through to the backup provider.
  # Note this is the async plane: retrying here is fine precisely because
  # tagging is not on a user-facing request path. The reranker (Phase 7) gets a
  # hard timeout and NO retry for the opposite reason.
  num_retries: 2
  request_timeout: 120
  fallbacks:
    - { "vlm-tagger": ["vlm-tagger-backup"] }
    # A depleted card must not read as "I do not understand you".
    - { "intent-classifier": ["intent-classifier-local"] }
  # Response cache: re-tagging an identical grid is free. Keyed on the request
  # body, so it also absorbs the duplicate deliveries the outbox relay can
  # produce at-least-once.
  cache: true
  cache_params:
    type: redis
    host: redis-cache
    port: 6379
    ttl: 604800 # 7 days
